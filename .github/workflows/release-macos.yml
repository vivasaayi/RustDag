name: Release macOS

on:
  push:
    tags:
      - 'v*'

jobs:
  release-macos:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'graalvm'
          java-version: '21'

      - name: Verify GraalVM native-image
        run: |
          which native-image || gu install native-image
          native-image --version

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@latest

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build frontend
        run: |
          cd ui
          npm ci
          npm run build

      - name: Build backend native image
        run: |
          cd backend
          chmod +x scripts/prepare_native_image.sh
          ./scripts/prepare_native_image.sh

      - name: Verify backend binary
        run: |
          if [ -f ui/src-tauri/bin/backend ]; then
            file ui/src-tauri/bin/backend
            chmod +x ui/src-tauri/bin/backend
          else
            echo "Warning: Native backend not found, will use JAR fallback"
            ls -la ui/src-tauri/bin/
          fi

      - name: Build Tauri app
        run: |
          cd ui
          npm run tauri:build -- --target universal-apple-darwin

      - name: Find DMG
        id: find-dmg
        run: |
          DMG=$(find ui/src-tauri/target/release/bundle/dmg -name "*.dmg" -type f 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            echo "Error: No DMG found"
            find ui/src-tauri/target/release/bundle -type f
            exit 1
          fi
          echo "dmg=$DMG" >> $GITHUB_OUTPUT
          echo "Found DMG: $DMG"

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.find-dmg.outputs.dmg }}
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to release
        run: |
          gh release upload ${{ steps.version.outputs.version }} \
            "${{ steps.find-dmg.outputs.dmg }}" \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post release notification
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'release-published',
              client_payload: {
                version: '${{ steps.version.outputs.version }}',
                download_url: 'https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }}'
              }
            });
